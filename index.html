<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="משחק לימוד חשבון לילדים – תרגול לוח הכפל, חיבור וחיסור בצורה כיפית עם ניקוד ורצפים.">
<meta name="theme-color" content="#6C5CE7">
<title>מלך החשבון – משחק כפל, חיבור וחיסור לילדים</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Varela+Round&display=swap" rel="stylesheet">
<style>
  :root{
    --purple:#6C5CE7;
    --sky:#4FC3F7;
    --pink:#FF6B9D;
    --yellow:#FFD166;
    --green:#2BB673;
    --green-soft:#D6F5E6;
    --red:#E24A5B;
    --red-soft:#FDE0E4;
    --ink:#2D2A46;
    --ink-soft:#6B6790;
    --card:#FFFFFF;
    --radius:24px;
  }

  *{box-sizing:border-box;margin:0;padding:0}

  body{
    font-family:'Varela Round', system-ui, 'Segoe UI', Arial, sans-serif;
    color:var(--ink);
    min-height:100vh;
    background:linear-gradient(160deg,#8FD6FF 0%,#A99BFF 55%,#FFA8D2 100%);
    background-attachment:fixed;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:16px;
    overflow-x:hidden;
  }

  .app{width:100%;max-width:520px}

  .card{
    background:var(--card);
    border-radius:var(--radius);
    box-shadow:0 18px 40px rgba(45,42,70,.22);
    padding:28px 22px;
    text-align:center;
  }

  .screen[hidden]{display:none}
  .screen{animation:pop .35s cubic-bezier(.34,1.56,.64,1)}

  h1{font-size:2rem;line-height:1.25;margin-bottom:6px}
  h2{font-size:1.6rem;margin-bottom:8px}
  .sub{color:var(--ink-soft);font-size:1rem;margin-bottom:22px}

  .mascot{font-size:3.4rem;display:block;margin-bottom:6px;animation:float 3s ease-in-out infinite}

  /* ---------- כפתורים ---------- */
  .btn{
    font-family:inherit;
    font-size:1.25rem;
    border:none;
    border-radius:18px;
    min-height:64px;
    width:100%;
    color:#fff;
    cursor:pointer;
    box-shadow:0 5px 0 rgba(0,0,0,.16);
    transition:transform .1s ease, box-shadow .1s ease, background .15s ease;
    padding:10px 14px;
  }
  .btn:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.16)}
  .btn:focus-visible{outline:4px solid var(--ink);outline-offset:3px}

  .modes{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .modes .btn:nth-child(1){background:var(--purple)}
  .modes .btn:nth-child(2){background:var(--green)}
  .modes .btn:nth-child(3){background:var(--sky)}
  .modes .btn:nth-child(4){background:var(--pink)}

  /* ---------- סרגל עליון ---------- */
  .hud{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:14px;font-size:1rem}
  .hud b{font-size:1.15rem}
  .chip{background:#F1F0FA;border-radius:999px;padding:6px 14px;white-space:nowrap}
  .chip.streak{background:var(--yellow);color:#6b4d00}

  .bar{height:12px;background:#EDECF7;border-radius:999px;overflow:hidden;margin-bottom:22px}
  .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--sky),var(--purple));border-radius:999px;transition:width .3s ease}

  /* ---------- שאלה ---------- */
  .question{
    font-size:3rem;
    letter-spacing:2px;
    direction:ltr;
    color:#fff;
    text-shadow:0 2px 6px rgba(45,42,70,.28);
    background:linear-gradient(135deg,#4FC3F7 0%,#6C5CE7 55%,#FF6B9D 100%);
    box-shadow:0 8px 20px rgba(108,92,231,.28);
    border-radius:20px;
    padding:22px 10px;
    margin-bottom:18px;
  }
  .question.shake{animation:shake .4s}
  .question.correct{animation:bounce .4s;background:linear-gradient(135deg,#2BB673 0%,#4FC3F7 100%)}

  .answers{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .answers .btn{background:#fff;color:var(--ink);border:3px solid #E6E4F5;box-shadow:0 5px 0 #E6E4F5;font-size:1.8rem;direction:ltr}
  .answers .btn:hover:not(:disabled){border-color:var(--purple)}
  .answers .btn:disabled{cursor:default}
  .answers .btn.good{background:var(--green-soft);border-color:var(--green);box-shadow:0 5px 0 var(--green);color:#136c44}
  .answers .btn.bad{background:var(--red-soft);border-color:var(--red);box-shadow:0 5px 0 var(--red);color:#a01f2e}

  .feedback{min-height:34px;margin-top:16px;font-size:1.25rem;font-weight:bold}
  .feedback.good{color:var(--green)}
  .feedback.bad{color:var(--red)}

  /* ---------- סיום ---------- */
  .score-big{font-size:4rem;color:var(--purple);line-height:1.1}
  .stats{color:var(--ink-soft);font-size:1.1rem;margin:6px 0 20px}
  .end-actions{display:grid;gap:12px}
  .btn-again{background:var(--purple)}
  .btn-menu{background:#B9B6D6}

  .quit{
    margin-top:18px;background:none;border:none;font-family:inherit;
    color:var(--ink-soft);font-size:.95rem;cursor:pointer;text-decoration:underline;
    padding:8px;
  }
  .quit:focus-visible{outline:3px solid var(--ink);outline-offset:2px}

  .hint{margin-top:14px;color:var(--ink-soft);font-size:.85rem}

  /* ---------- אנימציות ---------- */
  @keyframes pop{from{transform:scale(.92);opacity:0}to{transform:scale(1);opacity:1}}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
  @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
  @keyframes bounce{0%,100%{transform:scale(1)}45%{transform:scale(1.12)}}
  @keyframes fall{to{transform:translateY(110vh) rotate(420deg);opacity:0}}

  .confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:5}
  .confetti span{position:absolute;top:-40px;font-size:1.6rem;animation:fall linear forwards}

  @media (max-width:380px){
    h1{font-size:1.7rem}
    .question{font-size:2.4rem}
    .answers .btn{font-size:1.5rem}
    .modes{grid-template-columns:1fr}
  }

  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none!important;transition:none!important}
  }
</style>
</head>
<body>

<main class="app">

  <!-- מסך פתיחה -->
  <section class="screen card" id="screen-start">
    <span class="mascot" aria-hidden="true">🦉</span>
    <h1>מלך החשבון</h1>
    <p class="sub">בחרו תרגול ותתחילו לצבור נקודות!</p>
    <div class="modes">
      <button class="btn" data-mode="mul">✖️ כפל</button>
      <button class="btn" data-mode="add">➕ חיבור</button>
      <button class="btn" data-mode="sub">➖ חיסור</button>
      <button class="btn" data-mode="mix">🎲 מעורב</button>
    </div>
    <p class="hint">10 שאלות בכל סבב · רצף תשובות נכונות = יותר נקודות</p>
  </section>

  <!-- מסך משחק -->
  <section class="screen card" id="screen-game" hidden>
    <div class="hud">
      <span class="chip">שאלה <b id="qNum">1</b>/<b id="qTotal">10</b></span>
      <span class="chip streak" id="streakChip" hidden>🔥 רצף <b id="streak">0</b></span>
      <span class="chip">⭐ <b id="score">0</b></span>
    </div>
    <div class="bar"><i id="progress"></i></div>

    <div class="question" id="question" aria-live="off">7 × 8</div>

    <div class="answers" id="answers"></div>

    <p class="feedback" id="feedback" role="status" aria-live="polite"></p>
    <button class="quit" id="btnQuit">יציאה לתפריט</button>
    <p class="hint">אפשר לענות גם עם המקשים 1-4</p>
  </section>

  <!-- מסך סיום -->
  <section class="screen card" id="screen-end" hidden>
    <span class="mascot" id="endEmoji" aria-hidden="true">🏆</span>
    <h2 id="endTitle">כל הכבוד!</h2>
    <p class="score-big" id="finalScore">0</p>
    <p class="stats" id="finalStats">נקודות</p>
    <div class="end-actions">
      <button class="btn btn-again" id="btnAgain">🔁 עוד סבב!</button>
      <button class="btn btn-menu" id="btnMenu">🏠 חזרה לתפריט</button>
    </div>
  </section>

</main>

<script>
(function(){
  'use strict';

  var TOTAL = 10;
  var SIGN = { mul:'×', add:'+', sub:'−' };

  var state = {
    mode:'mul',
    index:0,
    score:0,
    correct:0,
    streak:0,
    current:null,
    seen:null,
    locked:false
  };

  var el = {
    start:  document.getElementById('screen-start'),
    game:   document.getElementById('screen-game'),
    end:    document.getElementById('screen-end'),
    qNum:   document.getElementById('qNum'),
    qTotal: document.getElementById('qTotal'),
    score:  document.getElementById('score'),
    streak: document.getElementById('streak'),
    streakChip: document.getElementById('streakChip'),
    progress: document.getElementById('progress'),
    question: document.getElementById('question'),
    answers:  document.getElementById('answers'),
    feedback: document.getElementById('feedback'),
    finalScore: document.getElementById('finalScore'),
    finalStats: document.getElementById('finalStats'),
    endTitle:   document.getElementById('endTitle'),
    endEmoji:   document.getElementById('endEmoji')
  };

  el.qTotal.textContent = TOTAL;

  function rnd(min,max){ return Math.floor(Math.random()*(max-min+1))+min; }

  function makeExercise(mode){
    var a,b,op;
    if(mode === 'mix'){ mode = ['mul','add','sub'][rnd(0,2)]; }

    if(mode === 'mul'){
      a = rnd(2,10); b = rnd(2,10); op = 'mul';
      return { a:a, b:b, op:op, answer:a*b };
    }
    if(mode === 'add'){
      a = rnd(1,50);
      b = rnd(1, Math.min(50, 100-a));
      return { a:a, b:b, op:'add', answer:a+b };
    }
    a = rnd(10,100);
    b = rnd(1,a);
    return { a:a, b:b, op:'sub', answer:a-b };
  }

  function nearMisses(ex){
    var out = [];
    if(ex.op === 'mul'){
      out.push(ex.a*(ex.b-1), ex.a*(ex.b+1), (ex.a-1)*ex.b, (ex.a+1)*ex.b, ex.answer+ex.a, ex.answer-ex.b);
    }
    out.push(ex.answer+1, ex.answer-1, ex.answer+2, ex.answer-2, ex.answer+10, ex.answer-10);
    return out;
  }

  function buildOptions(ex){
    var opts = [ex.answer];
    var pool = nearMisses(ex);

    // ערבוב הבריכה כדי שהמסיחים לא יהיו תמיד באותו סדר
    for(var i=pool.length-1;i>0;i--){
      var j = rnd(0,i), t = pool[i]; pool[i] = pool[j]; pool[j] = t;
    }

    for(var k=0;k<pool.length && opts.length<4;k++){
      var v = pool[k];
      if(v >= 0 && opts.indexOf(v) === -1) opts.push(v);
    }
    // רשת ביטחון – אם עדיין חסר, ממלאים באקראי
    var guard = 0;
    while(opts.length < 4 && guard++ < 100){
      var r = Math.max(0, ex.answer + rnd(-15,15));
      if(opts.indexOf(r) === -1) opts.push(r);
    }

    for(var m=opts.length-1;m>0;m--){
      var n = rnd(0,m), tmp = opts[m]; opts[m] = opts[n]; opts[n] = tmp;
    }
    return opts;
  }

  function showScreen(name){
    el.start.hidden = name !== 'start';
    el.game.hidden  = name !== 'game';
    el.end.hidden   = name !== 'end';
  }

  function startGame(mode){
    state.mode = mode;
    state.index = 0;
    state.score = 0;
    state.correct = 0;
    state.streak = 0;
    state.seen = {};
    el.score.textContent = '0';
    updateStreak();
    showScreen('game');
    nextQuestion();
  }

  function nextQuestion(){
    if(state.index >= TOTAL){ endGame(); return; }

    var ex, key, tries = 0;
    do{
      ex = makeExercise(state.mode);
      key = ex.a + ex.op + ex.b;
      tries++;
    } while(state.seen[key] && tries < 50);
    state.seen[key] = true;

    state.current = ex;
    state.locked = false;
    state.index++;

    el.qNum.textContent = state.index;
    el.progress.style.width = ((state.index-1)/TOTAL*100) + '%';
    el.feedback.textContent = '';
    el.feedback.className = 'feedback';
    el.question.className = 'question';
    el.question.textContent = ex.a + ' ' + SIGN[ex.op] + ' ' + ex.b;

    el.answers.innerHTML = '';
    buildOptions(ex).forEach(function(value){
      var btn = document.createElement('button');
      btn.className = 'btn';
      btn.type = 'button';
      btn.textContent = value;
      btn.addEventListener('click', function(){ answer(btn, value); });
      el.answers.appendChild(btn);
    });
  }

  function updateStreak(){
    el.streak.textContent = state.streak;
    el.streakChip.hidden = state.streak < 2;
  }

  function answer(btn, value){
    if(state.locked) return;
    state.locked = true;

    var right = value === state.current.answer;
    var buttons = el.answers.querySelectorAll('button');

    for(var i=0;i<buttons.length;i++){
      buttons[i].disabled = true;
      if(Number(buttons[i].textContent) === state.current.answer) buttons[i].classList.add('good');
    }

    if(right){
      state.correct++;
      state.streak++;
      state.score += 10 + 10 * Math.min(state.streak - 1, 3);
      el.score.textContent = state.score;
      el.question.classList.add('correct');
      el.feedback.className = 'feedback good';
      el.feedback.textContent = ['נכון! 🎉','מעולה! ⭐','יפה מאוד! 👏','בול! 💪'][rnd(0,3)];
    }else{
      state.streak = 0;
      btn.classList.remove('good');
      btn.classList.add('bad');
      el.question.classList.add('shake');
      el.feedback.className = 'feedback bad';
      el.feedback.textContent = 'כמעט! התשובה היא ' + state.current.answer;
    }

    updateStreak();
    el.progress.style.width = (state.index/TOTAL*100) + '%';
    setTimeout(nextQuestion, right ? 850 : 1500);
  }

  function endGame(){
    var pct = state.correct / TOTAL;
    el.finalScore.textContent = state.score;
    el.finalStats.textContent = 'נקודות · ' + state.correct + ' תשובות נכונות מתוך ' + TOTAL;

    if(pct === 1){        el.endTitle.textContent = 'מושלם!! אלוף אמיתי!'; el.endEmoji.textContent = '🏆'; }
    else if(pct >= 0.8){  el.endTitle.textContent = 'מדהים! כמעט הכל נכון'; el.endEmoji.textContent = '🌟'; }
    else if(pct >= 0.5){  el.endTitle.textContent = 'יפה! ממשיכים להשתפר'; el.endEmoji.textContent = '💪'; }
    else{                 el.endTitle.textContent = 'סבב טוב! עוד קצת תרגול'; el.endEmoji.textContent = '🚀'; }

    showScreen('end');
    if(pct >= 0.8) confetti();
  }

  function confetti(){
    if(window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    var box = document.createElement('div');
    box.className = 'confetti';
    box.setAttribute('aria-hidden','true');
    var emojis = ['🎉','⭐','🎊','✨','🥳'];
    for(var i=0;i<26;i++){
      var s = document.createElement('span');
      s.textContent = emojis[rnd(0,emojis.length-1)];
      s.style.left = rnd(0,98) + '%';
      s.style.animationDuration = (rnd(20,40)/10) + 's';
      s.style.animationDelay = (rnd(0,15)/10) + 's';
      box.appendChild(s);
    }
    document.body.appendChild(box);
    setTimeout(function(){ box.remove(); }, 6000);
  }

  // ---------- אירועים ----------
  var modeButtons = document.querySelectorAll('[data-mode]');
  for(var i=0;i<modeButtons.length;i++){
    (function(b){
      b.addEventListener('click', function(){ startGame(b.getAttribute('data-mode')); });
    })(modeButtons[i]);
  }

  document.getElementById('btnAgain').addEventListener('click', function(){ startGame(state.mode); });
  document.getElementById('btnMenu').addEventListener('click', function(){ showScreen('start'); });
  document.getElementById('btnQuit').addEventListener('click', function(){ state.locked = true; showScreen('start'); });

  document.addEventListener('keydown', function(e){
    if(el.game.hidden || state.locked) return;
    var n = parseInt(e.key, 10);
    if(n >= 1 && n <= 4){
      var b = el.answers.querySelectorAll('button')[n-1];
      if(b) b.click();
    }
  });

})();
</script>
</body>
</html>
